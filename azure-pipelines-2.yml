# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- meow
resources:
  pipelines:
    - pipeline: build
      source: 'Build'
      trigger: none
pool:
  name: 'Meow-hosted'

jobs:
- deployment: DeployToVM
  environment: vm-prod
  strategy:
    runOnce:
      deploy:
        steps:
       
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              # Ensure Docker is installed
              if ! command -v docker &> /dev/null; then
                sudo apt update 2>&1
                sudo apt install -y docker.io
                sudo systemctl start docker
                sudo systemctl enable docker
              fi


        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              mkdir -p ~/deploy
              cd ~/deploy

              echo "Downloading JAR from Azure Artifacts..."
              mvn dependency:get \
                -DrepoUrl=https://pkgs.dev.azure.com/if21b153z/aa8fe752-cc5f-47d5-aa3b-b6dd1cfbb188/_packaging/meow-registry/maven/v1 \
                -Dartifact=uni.local:mtcg:1.0-SNAPSHOT \
                -Dtransitive=false

              cp ~/.m2/repository/uni/local/mtcg/1.0-SNAPSHOT/mtcg-1.0-SNAPSHOT.jar .

        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              cd ~/deploy

              cat > Dockerfile <<EOF
              FROM eclipse-temurin:21-jdk
              COPY mtcg-1.0-SNAPSHOT.jar /app.jar
              ENTRYPOINT ["java", "-jar", "/app.jar"]
              EOF

              sudo docker rm -f mtcg-container || true
              sudo docker build -t mtcg-app .
              sudo docker run -d --name mtcg-container -p 8080:8080 mtcg-app
