trigger:
- meow

resources:
  pipelines:
    - pipeline: build
      source: 'Build'
      trigger: none

pool:
  name: 'Meow-hosted'

jobs:
- deployment: DeployToVM
  environment: vm-prod
  strategy:
    runOnce:
      deploy:
        steps:

        # 1. Ensure Docker is installed
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              if ! command -v docker &> /dev/null; then
                sudo apt update
                sudo apt install -y docker.io maven
                sudo systemctl enable docker
                sudo systemctl start docker
              fi

        # 2. Download JAR from Azure Artifacts
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              mkdir -p ~/deploy
              cd ~/deploy

              echo "Downloading JAR from Azure Artifacts..."
              mvn dependency:get \
                -DrepoId=meow-registry \
                -DrepoUrl=https://pkgs.dev.azure.com/if21b153z/aa8fe752-cc5f-47d5-aa3b-b6dd1cfbb188/_packaging/meow-registry/maven/v1 \
                -Dartifact=uni.local:mtcg:1.0-SNAPSHOT \
                -Dtransitive=false

              cp ~/.m2/repository/uni/local/mtcg/1.0-SNAPSHOT/mtcg-1.0-SNAPSHOT.jar .

        # 3. Build Dockerfile + app image
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              set +e
              cd ~/deploy

              cat > Dockerfile <<EOF
              FROM eclipse-temurin:21-jdk
              COPY mtcg-1.0-SNAPSHOT.jar /app.jar
              ENTRYPOINT ["java", "-jar", "/app.jar"]
              EOF
              sudo docker build -t mtcg-app . 2>/dev/null

        # 4. Start Postgres + app container (variables now expand correctly)
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: | 
              set +e
              cd ~/deploy

              sudo docker rm -f mtcg-postgres 2>/dev/null || true
              sudo docker volume create pgdata 2>/dev/null|| true

              sudo docker run -d \
                --name mtcg-postgres \
                -e POSTGRES_USER=$(DB_USER) \
                -e POSTGRES_PASSWORD=$(DB_PASSWORD) \
                -e POSTGRES_DB=$(PG_DB) \
                -v pgdata:/var/lib/postgresql/data \
                -p 5432:5432 \
                postgres:17 2>/dev/null

              sudo docker rm -f mtcg-container 2>/dev/null || true
              sudo docker run -d \
                --name mtcg-container \
                -p 8080:8080 \
                --link mtcg-postgres:postgres \
                -e DB_HOST=mtcg-postgres \
                -e DB_PORT=5432 \
                -e DB_USER=$(DB_USER) \
                -e DB_PASSWORD=$(DB_PASSWORD) \
                -e DB_NAME=$(PG_DB) \
                mtcg-app 2>/dev/null
