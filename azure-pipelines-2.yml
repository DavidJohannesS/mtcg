# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- meow
resources:
  pipelines:
    - pipeline: build
      source: 'Build'
      trigger: none
pool:
  name: 'Meow-hosted'

jobs:
- deployment: DeployToVM
  environment: vm-prod
  strategy:
    runOnce:
      deploy:
        steps:
       
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              # Ensure Docker is installed
              if ! command -v docker &> /dev/null; then
                sudo apt update 2>&1
                sudo apt install -y docker.io
                sudo systemctl start docker
                sudo systemctl enable docker
              fi
    
        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              cd ~/deploy

              # Start Postgres with variables
              sudo docker rm -f mtcg-postgres 2>/dev/null || true
              sudo docker volume create pgdata >/dev/null 2>&1 || true

              sudo docker run -d \
                --name mtcg-postgres \
                -e POSTGRES_USER=$(DB_USER) \
                -e POSTGRES_PASSWORD=$(DB_PASSWORD) \
                -e POSTGRES_DB=$(PG_DB) \
                -v pgdata:/var/lib/postgresql/data \
                -p 5432:5432 \
                postgres:15

              # Build app image
              sudo docker rm -f mtcg-container || true
              sudo docker build -t mtcg-app .

              # Run app container with DB vars
              sudo docker run -d \
                --name mtcg-container \
                -p 8080:8080 \
                --link mtcg-postgres:postgres \
                -e DB_HOST=mtcg-postgres \
                -e DB_PORT=5432 \
                -e DB_USER=$(PG_USER) \
                -e DB_PASSWORD=$(PG_PASSWORD) \
                -e DB_NAME=$(PG_DB) \
                mtcg-app

        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              mkdir -p ~/deploy
              cd ~/deploy

              echo "Downloading JAR from Azure Artifacts..."
              mvn dependency:get \
                -DrepoId=meow-registry \
                -DrepoUrl=https://pkgs.dev.azure.com/if21b153z/aa8fe752-cc5f-47d5-aa3b-b6dd1cfbb188/_packaging/meow-registry/maven/v1 \
                -Dartifact=uni.local:mtcg:1.0-SNAPSHOT \
                -Dtransitive=false


              cp ~/.m2/repository/uni/local/mtcg/1.0-SNAPSHOT/mtcg-1.0-SNAPSHOT.jar .

        - task: SSH@0
          inputs:
            sshEndpoint: 'vm'
            runOptions: 'inline'
            inline: |
              cd ~/deploy

              cat > Dockerfile <<EOF
              FROM eclipse-temurin:21-jdk
              COPY mtcg-1.0-SNAPSHOT.jar /app.jar
              ENTRYPOINT ["java", "-jar", "/app.jar"]
              EOF

              sudo docker rm -f mtcg-container || true
              sudo docker build -t mtcg-app .
              sudo docker run -d --name mtcg-container -p 8080:8080 mtcg-app
